openapi: 3.0.3
info:
  title: Formbar App API
  version: 1.0.0
  description: Session-authenticated REST API. Browser clients send the CSRF header on mutating requests.
servers:
  - url: /api/v1
paths:
  /me:
    get:
      summary: Current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fbapp.sid
  schemas:
    CurrentUserResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            displayName: { type: string }
            email: { type: string, nullable: true }
            roles:
              type: array
              items: { type: string }
            permissions:
              type: array
              items: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
