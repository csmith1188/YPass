# formbar-app — production reverse proxy
# Bind Node to 127.0.0.1 and do not expose APP_PORT publicly.
# TLS certificates: replace paths. Sticky sessions (ip_hash) are only
# required if SOCKET_IO_ALLOW_POLLING=true.

upstream formbar_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.yorktechapps.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.yorktechapps.com;

    ssl_certificate     /etc/ssl/certs/formbar-app.crt;
    ssl_certificate_key /etc/ssl/private/formbar-app.key;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    proxy_hide_header X-Powered-By;

    client_max_body_size 100k;

    location /css/ {
        alias /var/www/formbar-app/public/css/;
        expires 7d;
    }
    location /js/ {
        alias /var/www/formbar-app/public/js/;
        expires 7d;
    }

    location /socket.io/ {
        proxy_pass http://formbar_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://formbar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
