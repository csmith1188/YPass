name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          auth_header="AUTHORIZATION: bearer ${GH_TOKEN}"
          wiki_url="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git -c "http.https://github.com/.extraheader=${auth_header}" clone --depth 1 "$wiki_url" "$tmp"; then
            echo "::error::Initialize the GitHub Wiki first (Settings → Features → Wikis, create the Home page once), then re-run this workflow. If clone still fails, add a PAT with wiki access as secret WIKI_TOKEN."
            exit 1
          fi
          rsync -a --delete --exclude '.git' wiki/ "$tmp"/
          git -C "$tmp" config user.name "github-actions[bot]"
          git -C "$tmp" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tmp" add -A
          if git -C "$tmp" diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git -C "$tmp" commit -m "Sync wiki from ${GITHUB_SHA}"
          git -C "$tmp" -c "http.https://github.com/.extraheader=${auth_header}" push
